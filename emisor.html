<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emisor Ecógrafo - Transmisión en Vivo</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; margin: 0; padding: 20px; }
        .card { background: #1e1e1e; padding: 15px; margin: 15px auto; border-radius: 8px; max-width: 600px; border: 1px solid #333; }
        #status { font-size: 1.2rem; font-weight: bold; color: #ffc107; margin: 10px 0; }
        video { width: 100%; max-width: 800px; height: 450px; background: #000; border: 2px solid #00d2ff; border-radius: 8px; }
    </style>
</head>
<body>

    <h2>Emisor - Ecografía en Tiempo Real</h2>

    <div class="card">
        <div>Estado del Sistema:</div>
        <div id="status">Iniciando cámara y servidor...</div>
    </div>

    <video id="localVideo" autoplay playsinline muted></video>

    <script>
        // ID Exacto de la sala
        const SALA_ID = "eco-sala-chile-2026";
        const statusDiv = document.getElementById('status');
        const localVideo = document.getElementById('localVideo');

        // Configuración STUN para atravesar routers y firewalls
        const peer = new Peer(SALA_ID, {
            config: {
                'iceServers': [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            }
        });

        // Capturar video de la capturadora/cámara y micrófono
        navigator.mediaDevices.getUserMedia({
            video: { width: { ideal: 1920 }, height: { ideal: 1080 } },
            audio: true
        })
        .then(stream => {
            localVideo.srcObject = stream;

            peer.on('open', (id) => {
                statusDiv.innerText = " TRANSMITIENDO. Sala lista: " + id;
                statusDiv.style.color = "#00ff88";
            });

            // Responder cuando el radiólogo llame
            peer.on('call', (call) => {
                call.answer(stream);
                statusDiv.innerText = " Radiólogo conectado. Transmitiendo en vivo...";
                statusDiv.style.color = "#00ff88";

                // Escuchar el audio del radiólogo
                call.on('stream', (remoteAudioStream) => {
                    const audio = new Audio();
                    audio.srcObject = remoteAudioStream;
                    audio.play();
                });
            });
        })
        .catch(err => {
            statusDiv.innerText = " Error al acceder a la capturadora/cámara: " + err.message;
            statusDiv.style.color = "#ff4444";
        });

        peer.on('error', (err) => {
            statusDiv.innerText = " Error de conexión PeerJS: " + err.type;
            statusDiv.style.color = "#ff4444";
        });
    </script>
</body>
</html>
