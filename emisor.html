<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emisor Ecógrafo - Transmisión en Vivo</title>
    <!-- Librería PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; margin: 20px; }
        video { width: 80%; max-width: 800px; background: #000; border: 2px solid #00d2ff; border-radius: 8px; }
        .status { margin: 15px; padding: 10px; background: #222; display: inline-block; border-radius: 5px; }
        .id-box { font-size: 1.2rem; color: #00ff88; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Transmisor de Ecografía en Tiempo Real</h2>
    
    <div class="status">
        <span>ID de la Sala: </span>
        <span id="my-id" class="id-box">Generando ID...</span>
    </div>

    <div>
        <video id="localVideo" autoplay playsinline muted></video>
    </div>

    <script>
        // ID fijo para simplificar la prueba (puedes cambiarlo si deseas)
        const SALA_ID = "ecografo-sala-1";
        
        // Inicializar el Peer usando los servidores gratuitos de PeerJS
        const peer = new Peer(SALA_ID);
        const localVideo = document.getElementById('localVideo');
        const myIdDisplay = document.getElementById('my-id');

        let localStream;

        // 1. Capturar el video desde la capturadora HDMI (Aparece como webcam UVC)
        async function startCamera() {
            try {
                // Solicitar video en Alta Definición (1080p / 60fps idealmente)
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 1920 },
                        height: { ideal: 1080 },
                        frameRate: { ideal: 60 }
                    },
                    audio: true // Captura el micrófono para hablar con el radiólogo
                });
                localVideo.srcObject = localStream;
            } catch (err) {
                console.error("Error al acceder a la capturadora de video: ", err);
                alert("No se pudo acceder a la capturadora de video. Revisa la conexión USB/HDMI.");
            }
        }

        // 2. Al conectarse con éxito al servidor de señalización gratuito
        peer.on('open', (id) => {
            myIdDisplay.innerText = id;
            startCamera();
        });

        // 3. Esperar la llamada entrante del radiólogo
        peer.on('call', (call) => {
            // Responder automáticamente enviando la señal del ecógrafo
            call.answer(localStream);

            // Escuchar el audio bidireccional si el radiólogo habla
            call.on('stream', (remoteStream) => {
                const audio = new Audio();
                audio.srcObject = remoteStream;
                audio.play();
            });
        });

        peer.on('error', (err) => {
            console.error("Error en la conexión PeerJS:", err);
            myIdDisplay.innerText = "Error de conexión. Reintenta.";
            myIdDisplay.style.color = "red";
        });
    </script>
</body>
</html>
