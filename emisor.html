<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transmisión Ecográfica en Vivo</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; margin: 0; padding: 20px; }
        .card { background: #1e1e1e; padding: 20px; margin: 15px auto; border-radius: 8px; max-width: 600px; border: 1px solid #333; }
        #status { font-size: 1.2rem; font-weight: bold; color: #ffc107; margin: 15px 0; }
        video { width: 100%; max-width: 800px; height: 450px; background: #000; border: 2px solid #00d2ff; border-radius: 8px; }
        #link-box { word-break: break-all; margin-top: 10px; padding: 10px; background: #000; border-radius: 5px; color: #00ff88; display: none; }
    </style>
</head>
<body>

    <h2 id="titulo">Telemedicina Ecográfica</h2>

    <div class="card">
        <div id="status">Cargando sistema...</div>
        <div id="link-box"></div>
    </div>

    <video id="videoElem" autoplay playsinline controls></video>

    <script>
        const statusDiv = document.getElementById('status');
        const videoElem = document.getElementById('videoElem');
        const linkBox = document.getElementById('link-box');
        const titulo = document.getElementById('titulo');

        const urlParams = new URLSearchParams(window.location.search);
        const salaParam = urlParams.get('sala');

        const peerConfig = {
            config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }] }
        };

        if (!salaParam) {
            titulo.innerText = "Emisor - Ecógrafo en Vivo";
            statusDiv.innerText = "Solicitando permisos de cámara/capturadora...";

            navigator.mediaDevices.getUserMedia({ video: true, audio: true })
                .then(stream => {
                    videoElem.srcObject = stream;
                    videoElem.muted = true;

                    const salaId = "eco-" + Math.floor(100000 + Math.random() * 900000);
                    const peer = new Peer(salaId, peerConfig);

                    peer.on('open', (id) => {
                        const linkRadiologo = window.location.origin + window.location.pathname + "?sala=" + id;
                        statusDiv.innerText = " TRANSMITIENDO. Envía este enlace al radiólogo:";
                        statusDiv.style.color = "#00ff88";
                        
                        linkBox.style.display = "block";
                        linkBox.innerHTML = `<a href="${linkRadiologo}" target="_blank" style="color:#00ff88;">${linkRadiologo}</a>`;
                    });

                    peer.on('call', (call) => {
                        call.answer(stream);
                        statusDiv.innerText = " Radiólogo conectado. Transmitiendo en tiempo real...";
                    });

                    peer.on('error', (err) => {
                        statusDiv.innerText = "Error de red: " + err.type;
                        statusDiv.style.color = "#ff4444";
                    });
                })
                .catch(err => {
                    statusDiv.innerText = " Error: Acceso denegado a la cámara/capturadora.";
                    statusDiv.style.color = "#ff4444";
                });

        } else {
            titulo.innerText = "Receptor - Radiólogo en Línea";
            statusDiv.innerText = "Conectando automáticamente a la sala...";

            const peer = new Peer(peerConfig);

            peer.on('open', () => {
                const call = peer.call(salaParam, null);

                if (!call) {
                    statusDiv.innerText = " Error: No se pudo conectar a la sala.";
                    statusDiv.style.color = "#ff4444";
                    return;
                }

                call.on('stream', (remoteStream) => {
                    statusDiv.innerText = " TRANSMISIÓN EN VIVO ESTABLECIDA";
                    statusDiv.style.color = "#00ff88";
                    videoElem.srcObject = remoteStream;
                    videoElem.play();
                });

                call.on('error', (err) => {
                    statusDiv.innerText = " Error de enlace: " + err;
                    statusDiv.style.color = "#ff4444";
                });
            });
        }
    </script>
</body>
</html>
