<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receptor Radiólogo - Vista Ecográfica</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; margin: 0; padding: 20px; }
        .controls { margin-bottom: 15px; }
        input, button { padding: 10px 15px; font-size: 1rem; border-radius: 5px; border: none; }
        input { width: 250px; text-align: center; }
        button { background-color: #007bff; color: white; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #status { font-size: 1.1rem; font-weight: bold; color: #ffc107; margin: 15px 0; }
        video { width: 100%; max-width: 900px; height: 500px; background: #000; border: 2px solid #28a745; border-radius: 8px; }
    </style>
</head>
<body>

    <h2>Receptor - Radiólogo en Línea</h2>

    <div class="controls">
        <input type="text" id="targetId" value="eco-sala-chile-2026" placeholder="ID de la Sala">
        <button onclick="conectar()">Conectar al Ecógrafo</button>
    </div>

    <div id="status">Presiona "Conectar al Ecógrafo" para iniciar</div>

    <video id="remoteVideo" autoplay playsinline controls></video>

    <script>
        const statusDiv = document.getElementById('status');
        const remoteVideo = document.getElementById('remoteVideo');
        let localMicStream = null;

        // Activar micrófono del radiólogo para hablar con la sala
        navigator.mediaDevices.getUserMedia({ audio: true, video: false })
            .then(stream => { localMicStream = stream; })
            .catch(err => console.warn("Micrófono desactivado o no encontrado."));

        // Configuración STUN idéntica al emisor
        const peer = new Peer({
            config: {
                'iceServers': [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            }
        });

        function conectar() {
            const targetId = document.getElementById('targetId').value;
            statusDiv.innerText = "Conectando con el ecógrafo...";
            statusDiv.style.color = "#ffc107";

            // Iniciar la llamada enviando el micrófono local
            const call = peer.call(targetId, localMicStream);

            if (!call) {
                statusDiv.innerText = " Error: No se pudo conectar. Verifica que el emisor esté abierto primero.";
                statusDiv.style.color = "#ff4444";
                return;
            }

            call.on('stream', (remoteStream) => {
                statusDiv.innerText = " TRANSMISIÓN EN VIVO ESTABLECIDA";
                statusDiv.style.color = "#00ff88";
                remoteVideo.srcObject = remoteStream;
                remoteVideo.play();
            });

            call.on('error', (err) => {
                statusDiv.innerText = " Error de llamada: " + err;
                statusDiv.style.color = "#ff4444";
            });
        }
    </script>
</body>
</html>
