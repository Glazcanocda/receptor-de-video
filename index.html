<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Telemedicina Ecográfica Privada</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; margin: 0; padding: 20px; }
        .card { background: #1e1e1e; padding: 20px; margin: 15px auto; border-radius: 8px; max-width: 700px; border: 1px solid #333; }
        #status { font-size: 1.2rem; font-weight: bold; color: #ffc107; margin: 15px 0; }
        video { width: 100%; max-width: 900px; height: 500px; background: #000; border: 2px solid #00d2ff; border-radius: 8px; margin-top: 10px; }
        select, button, input { padding: 12px 18px; font-size: 1rem; border-radius: 5px; border: none; margin: 5px; }
        select, input { background: #333; color: white; width: 75%; }
        button { background: #007bff; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

    <h2 id="titulo">Central de Telemedicina Ecográfica Privada</h2>

    <div class="card">
        <!-- SECCIÓN MANUAL -->
        <div id="modo-box" style="display:none;">
            <p><strong>Selecciona tu rol en la plataforma:</strong></p>
            <button onclick="configurarModo('emisor')">🖥️ MODO MANUAL BOX</button>
            <button onclick="configurarModo('receptor')">👨‍⚕️ CENTRAL RADIÓLOGO</button>
        </div>

        <!-- PANEL EMISOR MANUAL -->
        <div id="emisor-box" style="display:none;">
            <h3>Configurar Transmisión de Box</h3>
            <label>Selecciona o escribe el ID de la Sala:</label><br><br>
            <input type="text" id="salaInputEmisor" placeholder="Ej: quillota-sala1"><br><br>
            <button onclick="iniciarTransmisionPantalla()">Iniciar Transmisión</button>
        </div>

        <!-- PANEL RECEPTOR (CENTRAL RADIÓLOGO) -->
        <div id="receptor-box" style="display:none;">
            <h3>Central de Monitoreo del Radiólogo</h3>
            <label>Ingresa o Selecciona el Código de Sala:</label><br><br>
            <input type="text" id="salaInputReceptor" placeholder="Ej: quillota-sala1"><br><br>
            <button onclick="conectarASala()">Conectar a Sala Seleccionada</button>
        </div>

        <div id="status">Cargando sistema...</div>
    </div>

    <video id="videoElem" autoplay playsinline controls></video>

    <script>
        const statusDiv = document.getElementById('status');
        const videoElem = document.getElementById('videoElem');
        const modoBox = document.getElementById('modo-box');
        const emisorBox = document.getElementById('emisor-box');
        const receptorBox = document.getElementById('receptor-box');
        const salaInputEmisor = document.getElementById('salaInputEmisor');
        const salaInputReceptor = document.getElementById('salaInputReceptor');

        const urlParams = new URLSearchParams(window.location.search);
        const modoAuto = urlParams.get('modo');
        const salaAuto = urlParams.get('sala');

        const peerConfig = {
            host: 'servidor-eco-2.onrender.com',
            port: 443,
            path: '/peerjs',
            secure: true,
            config: {
                'iceServers': [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            }
        };

        let streamLocal = null;
        let peer = null;
        let heartbeatInterval = null;

        function startHeartbeat(p) {
            if (heartbeatInterval) clearInterval(heartbeatInterval);
            heartbeatInterval = setInterval(() => {
                if (p && !p.destroyed) {
                    if (p.disconnected) { p.reconnect(); }
                    else { p.socket.send({ type: 'HEARTBEAT' }); }
                }
            }, 15000);
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (modoAuto === 'emisor' && salaAuto) {
                statusDiv.innerText = "Iniciando transmisión automática para " + salaAuto.toUpperCase() + "...";
                iniciarTransmisionAutomatica(salaAuto);
            } else {
                modoBox.style.display = 'block';
                statusDiv.innerText = "Esperando selección de modo...";
            }
        });

        function configurarModo(tipo) {
            modoBox.style.display = 'none';
            if (tipo === 'emisor') {
                emisorBox.style.display = 'block';
                statusDiv.innerText = "Ingresa el identificador de la sala e inicia transmisión.";
            } else {
                receptorBox.style.display = 'block';
                statusDiv.innerText = "Ingresa el identificador de la sala que deseas auditar.";
            }
        }

        async function iniciarTransmisionAutomatica(salaId) {
            try {
                streamLocal = await navigator.mediaDevices.getDisplayMedia({
                    video: { frameRate: { ideal: 30, max: 60 } },
                    audio: false
                });

                videoElem.srcObject = streamLocal;
                videoElem.muted = true;

                peer = new Peer(salaId, peerConfig);

                peer.on('open', (id) => {
                    startHeartbeat(peer);
                    statusDiv.innerText = "🔴 TRANSMITIENDO EN VIVO - SALA: " + id.toUpperCase();
                    statusDiv.style.color = "#00ff88";
                });

                peer.on('disconnected', () => { peer.reconnect(); });

                peer.on('call', (call) => {
                    statusDiv.innerText = "👨‍⚕️ RADIÓLOGO CONECTADO A LA SALA (" + salaId.toUpperCase() + ")";
                    statusDiv.style.color = "#00ff88";
                    call.answer(streamLocal);
                });

                peer.on('error', (err) => {
                    if(err.type === 'network') { peer.reconnect(); }
                    else {
                        statusDiv.innerText = "Error en sala (" + err.type + "). Reintentando...";
                        statusDiv.style.color = "#ff4444";
                    }
                });

            } catch (err) {
                statusDiv.innerText = "Permisos de captura de pantalla no otorgados.";
                statusDiv.style.color = "#ff4444";
            }
        }

        function iniciarTransmisionPantalla() {
            const sala = salaInputEmisor.value.trim();
            if(!sala) { alert("Ingresa un nombre de sala"); return; }
            iniciarTransmisionAutomatica(sala);
            emisorBox.style.display = 'none';
        }

        function conectarASala() {
            const salaObjetivo = salaInputReceptor.value.trim();
            if(!salaObjetivo) { alert("Ingresa el código de la sala"); return; }

            statusDiv.innerText = "Conectando con " + salaObjetivo.toUpperCase() + "...";

            if (peer) peer.destroy();

            peer = new Peer(peerConfig);

            peer.on('open', () => {
                startHeartbeat(peer);

                const canvas = document.createElement('canvas');
                canvas.width = 1; canvas.height = 1;
                const dummyStream = canvas.captureStream();

                const call = peer.call(salaObjetivo, dummyStream);

                if (call) {
                    call.on('stream', (remoteStream) => {
                        statusDiv.innerText = "🔴 TRANSMISIÓN EN DIRECTO ESTABLECIDA - SALA: " + salaObjetivo.toUpperCase();
                        statusDiv.style.color = "#00ff88";
                        videoElem.srcObject = remoteStream;
                        videoElem.play();
                    });

                    call.on('error', (err) => {
                        statusDiv.innerText = "Error al conectar con la sala.";
                        statusDiv.style.color = "#ff4444";
                    });
                }
            });

            peer.on('disconnected', () => { peer.reconnect(); });

            peer.on('error', (err) => {
                if(err.type === 'network') { peer.reconnect(); }
                else {
                    statusDiv.innerText = "La sala " + salaObjetivo.toUpperCase() + " no está transmitiendo.";
                    statusDiv.style.color = "#ff4444";
                }
            });
        }
    </script>
</body>
</html>
