<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telemedicina Ecográfica Privada</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; margin: 0; padding: 20px; }
        .card { background: #1e1e1e; padding: 20px; margin: 15px auto; border-radius: 8px; max-width: 650px; border: 1px solid #333; }
        #status { font-size: 1.2rem; font-weight: bold; color: #ffc107; margin: 15px 0; }
        video { width: 100%; max-width: 800px; height: 450px; background: #000; border: 2px solid #00d2ff; border-radius: 8px; margin-top: 10px; }
        #link-container { display: none; margin-top: 15px; padding: 15px; background: #000; border-radius: 5px; border: 1px solid #00ff88; }
        a { color: #00ff88; font-weight: bold; word-break: break-all; text-decoration: underline; font-size: 1.1rem; }
        select, button { padding: 10px 15px; font-size: 1rem; border-radius: 5px; border: none; margin: 5px; }
        select { background: #333; color: white; width: 80%; max-width: 400px; }
        button { background: #007bff; color: white; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <h2 id="titulo">Sistema de Transmisión Ecográfica Privado</h2>

    <div class="card">
        <div id="selector-box" style="display:none;">
            <label for="videoDevices">Selecciona la Cámara / Capturadora:</label><br><br>
            <select id="videoDevices"></select><br><br>
            <button onclick="iniciarTransmision()">Iniciar Transmisión</button>
        </div>

        <div id="status">Buscando dispositivos de video...</div>
        
        <div id="link-container">
            <div>Enlace único para la consulta del Radiólogo:</div>
            <p><a id="link-radiologo" href="#" target="_blank">Cargando enlace...</a></p>
        </div>
        <button id="retryBtn" style="display:none;" onclick="location.reload()">Reintentar Conexión</button>
    </div>

    <video id="videoElem" autoplay playsinline controls></video>

    <script>
        const statusDiv = document.getElementById('status');
        const videoElem = document.getElementById('videoElem');
        const linkContainer = document.getElementById('link-container');
        const linkRadiologo = document.getElementById('link-radiologo');
        const titulo = document.getElementById('titulo');
        const retryBtn = document.getElementById('retryBtn');
        const selectorBox = document.getElementById('selector-box');
        const videoDevices = document.getElementById('videoDevices');

        const urlParams = new URLSearchParams(window.location.search);
        const salaParam = urlParams.get('sala');

        const peerConfig = {
            host: 'servidor-eco-2.onrender.com',
            port: 443,
            path: '/peerjs',
            secure: true,
            config: {
                'iceServers': [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            }
        };

        let streamLocal = null;
        let heartbeatInterval = null;

        // Función Keep-Alive para mantener viva la conexión WebSocket en Render
        function startHeartbeat(peer) {
            if (heartbeatInterval) clearInterval(heartbeatInterval);
            heartbeatInterval = setInterval(() => {
                if (peer && !peer.destroyed) {
                    if (peer.disconnected) {
                        peer.reconnect();
                    } else {
                        peer.socket.send({ type: 'HEARTBEAT' });
                    }
                }
            }, 15000); // Enviar pulso cada 15 segundos
        }

        if (!salaParam) {
            // MODO EMISOR (Ecógrafo)
            titulo.innerText = "Emisor - Ecógrafo en Vivo";

            navigator.mediaDevices.getUserMedia({ video: true, audio: false })
                .then(tmpStream => {
                    tmpStream.getTracks().forEach(track => track.stop());
                    
                    navigator.mediaDevices.enumerateDevices().then(devices => {
                        const videoInputs = devices.filter(d => d.kind === 'videoinput');
                        videoDevices.innerHTML = '';
                        
                        if(videoInputs.length === 0) {
                            statusDiv.innerText = "Error: No se detectó ninguna cámara o capturadora USB conectada.";
                            statusDiv.style.color = "#ff4444";
                            return;
                        }

                        videoInputs.forEach((device, index) => {
                            const option = document.createElement('option');
                            option.value = device.deviceId;
                            option.text = device.label || `Cámara / Capturadora ${index + 1}`;
                            videoDevices.appendChild(option);
                        });
                        statusDiv.innerText = "Selecciona la fuente de video y presiona Iniciar.";
                        selectorBox.style.display = "block";
                    });
                })
                .catch(err => {
                    statusDiv.innerText = "Error (" + err.name + "): " + err.message;
                    statusDiv.style.color = "#ff4444";
                });

        } else {
            // MODO RECEPTOR (Radiólogo)
            titulo.innerText = "Receptor - Radiólogo en Línea";
            statusDiv.innerText = "Conectando al servidor privado...";

            const peer = new Peer(peerConfig);

            peer.on('open', (id) => {
                startHeartbeat(peer);
                statusDiv.innerText = "Conectado. Solicitando video a la sala...";
                
                const canvas = document.createElement('canvas');
                canvas.width = 1; canvas.height = 1;
                const dummyStream = canvas.captureStream();

                const call = peer.call(salaParam, dummyStream);

                call.on('stream', (remoteStream) => {
                    statusDiv.innerText = "TRANSMISIÓN EN VIVO ESTABLECIDA (Servidor Privado)";
                    statusDiv.style.color = "#00ff88";
                    videoElem.srcObject = remoteStream;
                    videoElem.play().catch(e => console.log("Click en pantalla si requiere interacción"));
                });

                call.on('error', (err) => {
                    statusDiv.innerText = "Error en la recepción de video.";
                    statusDiv.style.color = "#ff4444";
                    retryBtn.style.display = "inline-block";
                });
            });

            peer.on('disconnected', () => {
                statusDiv.innerText = "Reconectando con el servidor privado...";
                peer.reconnect();
            });

            peer.on('error', (err) => {
                if(err.type === 'network') {
                    peer.reconnect();
                } else {
                    statusDiv.innerText = "El emisor se desconectó o la sala venció. Genera un nuevo enlace.";
                    statusDiv.style.color = "#ff4444";
                    retryBtn.style.display = "inline-block";
                }
            });
        }

        function iniciarTransmision() {
            selectorBox.style.display = "none";
            statusDiv.innerText = "Registrando sala en el servidor privado...";

            const selectedDeviceId = videoDevices.value;
            const constraints = {
                video: { deviceId: selectedDeviceId ? { exact: selectedDeviceId } : undefined },
                audio: false
            };

            navigator.mediaDevices.getUserMedia(constraints)
                .then(stream => {
                    streamLocal = stream;
                    videoElem.srcObject = stream;
                    videoElem.muted = true;

                    const idUnico = "salaecografia" + Math.floor(1000 + Math.random() * 9000);
                    const peer = new Peer(idUnico, peerConfig);

                    peer.on('open', (id) => {
                        startHeartbeat(peer);
                        const urlFinal = window.location.origin + window.location.pathname + "?sala=" + id;
                        statusDiv.innerText = "TRANSMITIENDO EN VIVO (Infraestructura Privada)";
                        statusDiv.style.color = "#00ff88";
                        
                        linkRadiologo.href = urlFinal;
                        linkRadiologo.innerText = urlFinal;
                        linkContainer.style.display = "block";
                    });

                    peer.on('disconnected', () => {
                        console.log("Desconectado de señalización, reconectando...");
                        peer.reconnect();
                    });

                    peer.on('call', (call) => {
                        statusDiv.innerText = "Radiólogo conectado. Transmitiendo ecografía...";
                        call.answer(streamLocal);
                    });

                    peer.on('error', (err) => {
                        if(err.type === 'network') {
                            peer.reconnect();
                        } else {
                            statusDiv.innerText = "Error del Emisor: " + err.type;
                            statusDiv.style.color = "#ff4444";
                        }
                    });
                })
                .catch(err => {
                    statusDiv.innerText = "Error al acceder al dispositivo: " + err.message;
                    statusDiv.style.color = "#ff4444";
                });
        }
    </script>
</body>
</html>
