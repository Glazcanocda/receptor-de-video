<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telemedicina Ecográfica Privada</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-main: #0a0e17; --card-bg: #141b2d; --accent-blue: #00d2ff; --accent-green: #00ff88; --text-main: #e2e8f0; --text-muted: #94a3b8; --border-color: #1e293b; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        header { margin-bottom: 25px; text-align: center; }
        header h1 { font-size: 1.8rem; font-weight: 700; color: #fff; }
        header p { color: var(--text-muted); font-size: 0.95rem; margin-top: 5px; }
        .container { width: 100%; max-width: 950px; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 25px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); margin-bottom: 20px; text-align: center; }
        .grid-form { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; text-align: left; }
        @media(max-width: 600px) { .grid-form { grid-template-columns: 1fr; } }
        label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }
        select, input { width: 100%; background: #0f172a; border: 1px solid var(--border-color); color: #fff; padding: 12px 14px; border-radius: 8px; font-size: 0.95rem; outline: none; }
        .btn { background: linear-gradient(135deg, #0052d4, #4364f7, #6fb1fc); color: white; border: none; padding: 12px 24px; font-size: 1rem; font-weight: 600; border-radius: 8px; cursor: pointer; width: 100%; }
        .btn-green { background: linear-gradient(135deg, #11998e, #38ef7d); color: #000; }
        #status-bar { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px; border-radius: 8px; background: rgba(15, 23, 42, 0.6); font-size: 0.95rem; font-weight: 600; border: 1px solid var(--border-color); }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #e2e8f0; }
        .dot-pulse { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(0, 255, 136, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 136, 0); } }
        .video-wrapper { position: relative; width: 100%; border-radius: 12px; overflow: hidden; background: #000; border: 1px solid var(--border-color); }
        video { width: 100%; height: 500px; display: block; object-fit: contain; }
    </style>
</head>
<body>

    <header>
        <h1>Plataforma de Telemedicina Ecográfica</h1>
        <p>Red Privada de Transmisión Directa P2P</p>
    </header>

    <div class="container">
        <div class="card">
            <div id="modo-box">
                <p style="margin-bottom: 15px; font-weight: 500;">Selecciona el modo de operación:</p>
                <div style="display: flex; gap: 15px;">
                    <button class="btn" onclick="configurarModo('emisor')">🖥️ MODO BOX (Ecógrafo)</button>
                    <button class="btn btn-green" onclick="configurarModo('receptor')">👨‍⚕️ CENTRAL RADIÓLOGO</button>
                </div>
            </div>

            <!-- FORMULARIO EMISOR -->
            <div id="emisor-box" style="display:none;">
                <div class="grid-form">
                    <div>
                        <label>Centro Médico</label>
                        <input type="text" id="centroEmisor" placeholder="Ej: quillota">
                    </div>
                    <div>
                        <label>Sala / Box</label>
                        <input type="text" id="salaEmisor" placeholder="Ej: sala1">
                    </div>
                </div>
                <button class="btn" onclick="iniciarTransmisionPantalla()">Iniciar Transmisión de Pantalla</button>
            </div>

            <!-- FORMULARIO RECEPTOR -->
            <div id="receptor-box" style="display:none;">
                <div class="grid-form">
                    <div>
                        <label>Centro Médico</label>
                        <input type="text" id="centroReceptor" placeholder="Ej: quillota">
                    </div>
                    <div>
                        <label>Sala / Box</label>
                        <input type="text" id="salaReceptor" placeholder="Ej: sala1">
                    </div>
                </div>
                <button class="btn btn-green" onclick="conectarASala()">Conectar con el Ecógrafo</button>
            </div>

            <div id="status-bar" style="margin-top: 15px;">
                <span class="dot" id="status-dot"></span>
                <span id="status-text">Esperando selección de modo...</span>
            </div>
        </div>

        <div class="video-wrapper">
            <video id="videoElem" autoplay playsinline controls></video>
        </div>
    </div>

    <script>
        const statusText = document.getElementById('status-text');
        const statusDot = document.getElementById('status-dot');
        const videoElem = document.getElementById('videoElem');
        const modoBox = document.getElementById('modo-box');
        const emisorBox = document.getElementById('emisor-box');
        const receptorBox = document.getElementById('receptor-box');

        const urlParams = new URLSearchParams(window.location.search);
        const modoAuto = urlParams.get('modo');
        const centroAuto = urlParams.get('centro');
        const salaAuto = urlParams.get('sala');

        // Configuración apuntando al servidor privado de Render
        const peerConfig = {
            host: 'servidor-eco-2.onrender.com',
            port: 443,
            path: '/peerjs',
            secure: true,
            config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }] }
        };

        let streamLocal = null;
        let peer = null;
        let heartbeatInterval = null;

        function updateStatus(text, color = '#e2e8f0', pulse = false) {
            statusText.innerText = text;
            statusText.style.color = color;
            statusDot.style.background = color;
            if (pulse) statusDot.classList.add('dot-pulse');
            else statusDot.classList.remove('dot-pulse');
        }

        function startHeartbeat(p) {
            if (heartbeatInterval) clearInterval(heartbeatInterval);
            heartbeatInterval = setInterval(() => {
                if (p && !p.destroyed) {
                    if (p.disconnected) { p.reconnect(); }
                    else { p.socket.send({ type: 'HEARTBEAT' }); }
                }
            }, 15000);
        }

        function generarSalaId(centro, sala) {
            const cleanCentro = centro.trim().toLowerCase().replace(/\s+/g, '-');
            const cleanSala = sala.trim().toLowerCase().replace(/\s+/g, '-');
            return `${cleanCentro}_${cleanSala}`;
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (modoAuto === 'emisor' && centroAuto && salaAuto) {
                const salaId = generarSalaId(centroAuto, salaAuto);
                updateStatus(`Iniciando transmisión para ${centroAuto.toUpperCase()} - ${salaAuto.toUpperCase()}...`, '#00d2ff');
                iniciarTransmisionAutomatica(salaId);
            } else if (modoAuto === 'receptor' && centroAuto && salaAuto) {
                const salaId = generarSalaId(centroAuto, salaAuto);
                conectarASalaDirecta(salaId);
            } else {
                modoBox.style.display = 'block';
            }
        });

        function configurarModo(tipo) {
            modoBox.style.display = 'none';
            if (tipo === 'emisor') {
                emisorBox.style.display = 'block';
                updateStatus("Configura el centro y la sala del ecógrafo.");
            } else {
                receptorBox.style.display = 'block';
                updateStatus("Ingresa la ubicación del examen a auditar.");
            }
        }

        async function iniciarTransmisionAutomatica(salaId) {
            try {
                streamLocal = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: { ideal: 30, max: 60 } }, audio: false });
                videoElem.srcObject = streamLocal;
                videoElem.muted = true;

                peer = new Peer(salaId, peerConfig);

                peer.on('open', (id) => {
                    startHeartbeat(peer);
                    updateStatus(`TRANSMITIENDO EN VIVO (ID: ${id})`, '#00ff88', true);
                });

                peer.on('disconnected', () => { peer.reconnect(); });
                peer.on('call', (call) => {
                    updateStatus(`RADIÓLOGO CONECTADO EN DIRECTO`, '#00ff88', true);
                    call.answer(streamLocal);
                });
                peer.on('error', (err) => {
                    if (err.type === 'network') peer.reconnect();
                    else updateStatus(`Error de red: ${err.type}`, '#ff4757');
                });
            } catch (err) {
                updateStatus("Permisos de captura de pantalla denegados.", '#ff4757');
            }
        }

        function iniciarTransmisionPantalla() {
            const centro = document.getElementById('centroEmisor').value;
            const sala = document.getElementById('salaEmisor').value;
            if (!centro || !sala) { alert("Ingresa centro y sala."); return; }
            
            const salaId = generarSalaId(centro, sala);
            iniciarTransmisionAutomatica(salaId);
            emisorBox.style.display = 'none';
        }

        function conectarASalaDirecta(salaObjetivo) {
            updateStatus(`Conectando con ${salaObjetivo}...`, '#ffc107');

            if (peer) peer.destroy();
            const radiologoId = "radiologo_" + Math.floor(1000 + Math.random() * 9000);
            peer = new Peer(radiologoId, peerConfig);

            peer.on('open', () => {
                startHeartbeat(peer);
                const canvas = document.createElement('canvas');
                canvas.width = 1; canvas.height = 1;

                const call = peer.call(salaObjetivo, canvas.captureStream());

                if (call) {
                    call.on('stream', (remoteStream) => {
                        updateStatus(`TRANSMISIÓN EN DIRECTO - SALA: ${salaObjetivo.toUpperCase()}`, '#00ff88', true);
                        videoElem.srcObject = remoteStream;
                        videoElem.play();
                    });
                    call.on('error', () => updateStatus("Error en la llamada.", '#ff4757'));
                }
            });

            peer.on('disconnected', () => { peer.reconnect(); });
            peer.on('error', (err) => {
                if (err.type === 'network') peer.reconnect();
                else updateStatus(`La sala ${salaObjetivo.toUpperCase()} no está transmitiendo.`, '#ff4757');
            });
        }

        function conectarASala() {
            const centro = document.getElementById('centroReceptor').value;
            const sala = document.getElementById('salaReceptor').value;
            if (!centro || !sala) { alert("Ingresa centro y sala."); return; }
            conectarASalaDirecta(generarSalaId(centro, sala));
            receptorBox.style.display = 'none';
        }
    </script>
</body>
</html>
